[project]
name = "held-back-check"
# Released as a git tag, not a distribution: ``release.yml`` tags ``vX.Y.Z`` and
# creates the GitHub Release when this moves past the newest tag. Consumers pin
# the tag's commit SHA.
version = "0.0.0"
description = "A GitHub Action that fails when an unpinned uv resolve holds a direct dependency below its newest release, and says what holds it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

[dependency-groups]
dev = [
    # The script's one third-party import. It runs in the *consumer's*
    # environment, so this group is what the tests need, not what consumers get.
    "packaging>=22",
    # Unconditional rather than ``python_version < '3.11'``: the tests load the
    # script with ``tomllib`` hidden to cover the 3.10 fallback on every Python.
    "tomli>=2",
    # The action-wiring tests read action.yml as structure, not as text.
    "pyyaml>=6.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.8.0",
    "ruff>=0.14.0",
    "ty>=0.0.32",
]

[tool.uv]
# Nothing to build: the action runs the script by path.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov --cov-report=term-missing"

[tool.coverage.run]
# By directory rather than module name: one test runs the script as
# ``__main__``, and a module-name source would not count that run as the script.
source = ["."]
omit = ["tests/*"]
branch = true

[tool.coverage.report]
fail_under = 100

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "TID"]
ignore = ["E501"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.10"

# bump-my-version drives `make release-bump`: it rewrites the version above and
# promotes the CHANGELOG [Unreleased] block under a new dated heading.
[tool.bumpversion]
current_version = "0.0.0"
allow_dirty = false
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
# Anchored, or it would also match ``current_version`` below.
regex = true
search = '^version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = """## [Unreleased]

## [{new_version}] — {now:%Y-%m-%d}"""

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "[Unreleased]: https://github.com/Artui/held-back-check/compare/v{current_version}...HEAD"
replace = """[Unreleased]: https://github.com/Artui/held-back-check/compare/v{new_version}...HEAD
[{new_version}]: https://github.com/Artui/held-back-check/compare/v{current_version}...v{new_version}"""
